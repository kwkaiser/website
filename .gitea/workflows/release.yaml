name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. v1.2.3'
        required: true

env:
  REGISTRY: git.kwkaiser.io
  IMAGE: git.kwkaiser.io/kwkaiser/website

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${{ github.ref_name }}"
          fi
          version="${version#v}"
          if [ -z "$version" ]; then
            echo "could not resolve a version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build image
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          nix develop --accept-flake-config --command \
            task build-image IMAGE_NAME="$IMAGE" IMAGE_TAG="$VERSION"

      - name: Push image
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.K8S_GITEA_REGISTRY_PACKAGE_TOKEN }}
        run: |
          nix develop --accept-flake-config --command \
            task push-image IMAGE_NAME="$IMAGE" IMAGE_TAGS="$VERSION $SHA latest"
