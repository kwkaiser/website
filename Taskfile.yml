version: '3'

tasks:
  clean:
    cmds:
      - rm -rf public

  dev:
    cmds:
      - hugo server

  build-resume:
    desc: Compile the typst resume into both static/pdf and content/.
    sources:
      - docs/resume.typ
    generates:
      - static/pdf/resume.pdf
      - content/resume.pdf
    cmds:
      - typst compile docs/resume.typ static/pdf/resume.pdf
      - cp static/pdf/resume.pdf content/resume.pdf

  build:
    deps: [build-resume]
    cmds:
      - rm -rf public
      - hugo

  build-image:
    desc: Build the site container image into .task/image.tar. No docker daemon required.
    deps: [build]
    vars:
      IMAGE_NAME: '{{.IMAGE_NAME | default "git.kwkaiser.io/kwkaiser/website"}}'
      IMAGE_TAG: '{{.IMAGE_TAG | default "dev"}}'
    cmds:
      - mkdir -p .task
      - |
        stream=$(SITE_DIR="$PWD/public" \
          IMAGE_NAME="{{.IMAGE_NAME}}" \
          IMAGE_TAG="{{.IMAGE_TAG}}" \
          nix build --impure --no-link --print-out-paths .#image)
        "$stream" > .task/image.tar

  push-image:
    desc: Push .task/image.tar to the container registry. Needs REGISTRY_USER and REGISTRY_TOKEN.
    vars:
      IMAGE_NAME: '{{.IMAGE_NAME | default "git.kwkaiser.io/kwkaiser/website"}}'
      IMAGE_TAGS: '{{.IMAGE_TAGS | default "dev"}}'
      TLS_VERIFY: '{{.TLS_VERIFY | default "true"}}'
    preconditions:
      - sh: test -f .task/image.tar
        msg: '.task/image.tar not found - run `task build-image` first'
    cmds:
      - |
        set -eu
        : "${REGISTRY_USER:?REGISTRY_USER is not set}"
        : "${REGISTRY_TOKEN:?REGISTRY_TOKEN is not set}"
        for tag in {{.IMAGE_TAGS}}; do
          echo "pushing {{.IMAGE_NAME}}:$tag"
          skopeo copy \
            --dest-tls-verify={{.TLS_VERIFY}} \
            --dest-creds "$REGISTRY_USER:$REGISTRY_TOKEN" \
            docker-archive:.task/image.tar \
            "docker://{{.IMAGE_NAME}}:$tag"
        done
